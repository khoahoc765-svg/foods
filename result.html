<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả | Hôm nay ăn gì?</title>
  <meta name="description" content="Món ăn đã được chọn cho bạn. Tìm quán gần đây hoặc quay lần nữa.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23C2410C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Bỏ qua đến nội dung chính</a>
  <header class="site-header wrap" data-header></header>

  <main id="main" class="wrap">
    <p class="sr-only" id="result-live" aria-live="polite"></p>

    <article class="result" id="result">
      <div class="result__photo"><img id="dish-photo" alt="" width="1200" height="900"></div>
      <div>
        <p class="result__meta" id="dish-meta">Đang quay...</p>
        <h1 id="dish-name">Hôm nay ăn gì?</h1>
        <p class="result__desc" id="dish-desc">Chờ một chút nhé.</p>
        <div class="result__actions">
          <a class="btn btn--primary btn--lg" id="btn-maps" target="_blank" rel="noopener noreferrer">Tìm quán gần đây</a>
          <button class="btn btn--lg" id="btn-again" type="button">Quay lần nữa</button>
        </div>
      </div>
    </article>

    <section class="empty" id="empty" hidden>
      <h1 id="empty-title">Chưa có món phù hợp</h1>
      <p id="empty-text">Bạn thử chọn bất kỳ món nào nhé.</p>
      <a class="btn btn--primary btn--lg" href="result.html?mode=any">Chọn bất kỳ món nào</a>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/result.js"></script>

</html>
